# Wine-Assembly override for GOG's bundled Windows DOSBox 0.74.
# Exercise the native x86 dynamic recompiler while avoiding host-dependent
# fullscreen, overlay, audio, and joystick paths.

[sdl]
fullscreen=false
output=surface
autolock=false

[render]
aspect=false
scaler=none

[cpu]
core=dynamic
cycles=fixed 50000

[mixer]
nosound=true

[joystick]
joysticktype=none

[autoexec]
@ECHO OFF
mount C C:\
C:
COPY SW.DAT SW.EXE
SW.EXE
