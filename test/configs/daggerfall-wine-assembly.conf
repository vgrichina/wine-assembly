# Wine-Assembly override for GOG's bundled DOSBox 0.74-2.1.
#
# DOSBox's dynamic core emits x86 at runtime. Running that nested recompiler in
# Wine-Assembly currently makes the CauseWay loader report error 05 despite
# working XMS allocation/lock calls. The simple core stays inside DOSBox's
# interpreter and reaches Daggerfall's Bethesda intro.

[sdl]
fullscreen=false
output=surface

[render]
aspect=false
scaler=none

[dosbox]
memsize=63

[cpu]
core=simple
cycles=fixed 50000

[mixer]
nosound=true

[dos]
xms=true
ems=true
umb=true
