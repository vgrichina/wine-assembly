# Wine-Assembly override for GOG's bundled DOSBox 0.74-2.1.
#
# Exercise GOG DOSBox's native x86 dynamic recompiler inside Wine-Assembly.
# This nested-JIT path catches flag-preservation bugs that the simple core
# cannot expose.

[sdl]
fullscreen=false
output=surface
autolock=false

[render]
aspect=false
scaler=none

[dosbox]
memsize=63

[cpu]
core=dynamic
cycles=fixed 50000

[mixer]
nosound=true

[dos]
xms=true
ems=true
umb=true
