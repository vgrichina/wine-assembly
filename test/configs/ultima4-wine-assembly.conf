# Wine-Assembly override for GOG's bundled Windows DOSBox 0.74-2.1.
# Keep the nested x86 dynamic recompiler enabled while avoiding host-specific
# fullscreen, overlay, audio, and joystick paths.

[sdl]
fullscreen=false
output=surface

[render]
aspect=false
scaler=none

[cpu]
core=dynamic
cycles=fixed 3000

[mixer]
nosound=true

[joystick]
joysticktype=none

[ipx]
ipx=false

[autoexec]
@ECHO OFF
mount C C:\
C:
CLS
ULTIMA.COM
