<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#008080">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wine-Assembly">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Wine-Assembly — Windows 98 Emulator</title>
  <style>
    @font-face {
      font-family: "W95FA";
      src: url("fonts/w95fa.woff2") format("woff2"),
           url("fonts/W95FA.otf") format("opentype");
      font-display: block;
    }
    @font-face {
      font-family: "Fixedsys Excelsior";
      src: url("fonts/FSEX302.ttf") format("truetype");
      font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #008080;
      font-family: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, sans-serif;
      color: #000;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      margin: 8px;
    }
    #titlebar {
      background: linear-gradient(to right, #000080, #1084d0);
      color: white;
      padding: 4px 8px;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #toolbar {
      padding: 4px 6px;
      border-bottom: 1px solid #808080;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    #toolbar select, #toolbar button {
      font-family: inherit;
      font-size: 12px;
      padding: 2px 8px;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      cursor: pointer;
    }
    #toolbar button:active { border-style: inset; }
    #toolbar .debug-midi,
    #toolbar .debug-slice,
    #toolbar .debug-record,
    #toolbar .debug-profile {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #toolbar #record-btn.recording {
      background: #c00000;
      color: #fff;
      border-color: #800000;
    }
    #toolbar .debug-profile label {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    #toolbar .debug-profile input {
      margin: 0;
    }
    #input-profile-status {
      min-width: 78px;
      color: #404040;
      font-variant-numeric: tabular-nums;
    }
    #content {
      flex: 1;
      display: flex;
      gap: 0;
      min-height: 0;
    }
    #screen-wrap {
      flex: 1;
      display: flex;
      background: #008080;
      overflow: hidden;
      position: relative;
    }
    canvas {
      image-rendering: pixelated;
      cursor: default;
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #mobile-keyboard-proxy {
      position: fixed;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: 0;
      padding: 0;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      resize: none;
      outline: none;
      pointer-events: none;
      z-index: -1;
    }
    #browser-fullscreen-consent {
      display: none;
      position: relative;
      order: -1;
      flex: 0 0 34px;
      width: 100%;
      z-index: 20;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 8px;
      padding: 4px max(8px, env(safe-area-inset-right)) 4px max(8px, env(safe-area-inset-left));
      color: #fff;
      background: #000080;
      border-bottom: 2px outset #dfdfdf;
      font-size: 11px;
      pointer-events: auto;
    }
    #browser-fullscreen-consent button {
      padding: 3px 8px;
      color: #000;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      font: inherit;
      cursor: pointer;
    }
    #browser-fullscreen-consent button:active { border-style: inset; }
    #log {
      width: 320px;
      min-height: 0;
      background: #000;
      color: #0f0;
      font-family: "Fixedsys", "Courier New", monospace;
      font-size: 11px;
      padding: 6px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      border-left: 2px inset #808080;
    }
    #taskbar {
      background: #c0c0c0;
      border-top: 2px outset #dfdfdf;
      padding: 2px 4px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 2px;
      font-family: "Microsoft Sans Serif", "MS Sans Serif", Tahoma, Arial, sans-serif;
    }
    #taskbar .start-btn {
      font-weight: bold;
      padding: 2px 6px 2px 2px;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      height: 22px;
    }
    #taskbar .start-btn:active,
    #taskbar .start-btn.open { border-style: inset; }
    #start-menu {
      position: absolute;
      bottom: 28px;
      left: 4px;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      font-family: "Microsoft Sans Serif", "MS Sans Serif", Tahoma, Arial, sans-serif;
      font-size: 11px;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      display: none;
      z-index: 100;
      min-width: 200px;
      padding: 2px;
      flex-direction: row;
      align-items: stretch;
    }
    #start-menu.open { display: flex; }
    #start-menu .banner {
      background: linear-gradient(to bottom, #1084d0, #000080);
      color: #fff;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-weight: bold;
      font-size: 18px;
      padding: 10px 4px;
      width: 26px;
      letter-spacing: 2px;
      flex: 0 0 auto;
      text-align: center;
    }
    #start-menu .items { flex: 1; padding: 2px 0; }
    #start-menu .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 16px 5px 8px;
      cursor: pointer;
      color: #000;
      text-decoration: none;
      white-space: nowrap;
    }
    #start-menu .item:hover { background: #000080; color: #fff; }
    #start-menu .item.recording { font-weight: bold; }
    #start-menu .item.recording .ico { color: #c00000; }
    #start-menu .item.recording:hover .ico { color: #fff; }
    #start-menu .item .ico { font-size: 16px; width: 18px; text-align: center; }
    #start-menu .sep { height: 1px; background: #808080; border-bottom: 1px solid #fff; margin: 3px 4px; }
    .win-flag { display: inline-grid; grid-template-columns: 5px 5px; gap: 1px; }
    .win-flag span { width: 5px; height: 5px; display: block; }
    #task-buttons { display: flex; gap: 2px; flex: 1; min-width: 0; overflow: hidden; }
    #task-buttons .task-btn {
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      padding: 2px 6px;
      height: 22px;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }
    #task-buttons .task-btn.active { border-style: inset; font-weight: bold; }
    #clock-area {
      margin-left: auto;
      border: 1px inset #808080;
      padding: 2px 8px;
      height: 22px;
      display: flex;
      align-items: center;
    }
    #compile-status {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #c0c0c0; border: 2px outset #dfdfdf; padding: 16px 24px;
      font-family: "MS Sans Serif", Tahoma, sans-serif; font-size: 13px;
      z-index: 9999; display: none;
    }
    #desktop-icons {
      position: absolute; top: 0; left: 0;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, 80px);
      grid-auto-rows: 84px;
      gap: 4px 8px;
      align-content: start;
      pointer-events: none;
      z-index: 1;
      transform-origin: top left;
    }
    .desktop-icon {
      pointer-events: auto;
      width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      padding: 2px;
    }
    .desktop-icon .icon-img {
      width: 32px; height: 32px;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .desktop-icon .icon-label {
      color: white;
      font-size: 11px;
      text-align: center;
      text-shadow: 1px 1px 0 #000;
      padding: 1px 3px;
      max-width: 76px;
      word-wrap: break-word;
      line-height: 1.1;
    }
    .desktop-icon.selected .icon-label {
      background: #000080;
      outline: 1px dotted #fff;
    }
    body.no-debug #shell { margin: 0; border: 0; background: transparent; }
    body.no-debug #titlebar,
    body.no-debug #toolbar,
    body.no-debug #log { display: none; }
    body.no-debug #screen-wrap { background: #008080; }
    body.no-debug canvas { background: transparent; z-index: 2; }
    body.no-debug.exclusive-fullscreen,
    body.no-debug.exclusive-fullscreen #shell,
    body.no-debug.exclusive-fullscreen #content,
    body.no-debug.exclusive-fullscreen #screen-wrap {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      border: 0;
      background: #000;
    }
    body.no-debug.exclusive-fullscreen {
      overflow: hidden;
    }
    body.no-debug.exclusive-fullscreen #screen-wrap {
      position: fixed;
      inset: 0;
      max-width: none;
      max-height: none;
      flex-direction: column;
    }
    body.no-debug.exclusive-fullscreen #titlebar,
    body.no-debug.exclusive-fullscreen #toolbar,
    body.no-debug.exclusive-fullscreen #log,
    body.no-debug.exclusive-fullscreen #taskbar,
    body.no-debug.exclusive-fullscreen #desktop-icons { display: none !important; }
    body.exclusive-fullscreen #browser-fullscreen-consent { display: flex; }
    body.no-debug.exclusive-fullscreen canvas {
      position: relative !important;
      inset: auto !important;
      flex: 1 1 0;
      min-height: 0;
      width: 100% !important;
      height: 0 !important;
      max-width: none !important;
      max-height: none !important;
    }
    /* In ?debug, an app's fullscreen request is only a request. Keep the
       toolbar and log available and fit the exclusive surface into the
       remaining pane until the user explicitly enters browser fullscreen. */
    body:not(.no-debug).exclusive-fullscreen #screen-wrap {
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    body:not(.no-debug).exclusive-fullscreen canvas {
      position: relative !important;
      inset: auto !important;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      width: 100% !important;
      height: 0 !important;
    }
    #screen-wrap:fullscreen {
      position: fixed;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      margin: 0;
      padding: 0;
      background: #000;
    }
    #screen-wrap:-webkit-full-screen {
      position: fixed;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      margin: 0;
      padding: 0;
      background: #000;
    }
    #screen-wrap::backdrop,
    #screen-wrap::-webkit-backdrop {
      background: #000;
    }
    #screen-wrap:fullscreen canvas,
    #screen-wrap:-webkit-full-screen canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
    #screen-wrap:fullscreen #browser-fullscreen-consent,
    #screen-wrap:-webkit-full-screen #browser-fullscreen-consent {
      display: none;
    }
  </style>
</head>

        <label><input id="perf-stream-toggle" type="checkbox" onchange="setPerfStream(this.checked)">Stream</label>
        <label title="Experimental: opt into real guest threads. Needs cross-origin isolation; the worker backend is still phase 1."><input id="threads-toggle" type="checkbox" onchange="setThreads(this.checked)">Threads</label>

      </span>

      </span>

        <button id="thread-state-btn" onclick="openThreadState()" title="Open live scheduler, yield, and critical-section state">Thread state</button>

      <span id="status" style="margin-left: auto; color: #808080;"></span>

      <div id="screen-wrap">

        <div id="browser-fullscreen-consent" role="group" aria-label="Browser fullscreen option">
          <span>App is using the full page</span>

Resource-aware Win98 emulator
================================
</div>

    <button class="start-btn" id="start-btn" onclick="toggleStartMenu(event)"><span class="win-flag"><span style="background:#FF0000"></span><span style="background:#00FF00"></span><span style="background:#0000FF"></span><span style="background:#FFFF00"></span></span>Start</button>
    <div id="task-buttons"></div>

    <div class="banner">Wine&nbsp;Assembly</div>

      <a class="item" href="story.html"><span class="ico">&#128218;</span>The Story</a>

  <script>
    function closeStartMenu() {
      const m = document.getElementById('start-menu');
      const b = document.getElementById('start-btn');
      m.classList.remove('open');
      b.classList.remove('open');
    }
    function toggleStartMenu(e) {
      if (e) e.stopPropagation();
      const m = document.getElementById('start-menu');
      const b = document.getElementById('start-btn');
      const open = m.classList.toggle('open');
      b.classList.toggle('open', open);
    }
    function toggleRecordingFromStart(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      closeStartMenu();
      if (typeof toggleRecording === 'function') toggleRecording();
    }
    document.addEventListener('click', (e) => {
      const m = document.getElementById('start-menu');
      if (!m.classList.contains('open')) return;
      if (e.target.closest('#start-menu') || e.target.closest('#start-btn')) return;
      closeStartMenu();
    });
  </script>

  <script src="lib/mem-utils.js?v=168"></script>

  <script src="lib/browser-input.js?v=1"></script>

  <script>

    async function approveBrowserFullscreen(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const target = document.getElementById('screen-wrap');
      const current = document.fullscreenElement || document.webkitFullscreenElement;
      if (!target || current === target) return;
      const request = target.requestFullscreen || target.webkitRequestFullscreen;
      if (!request) return;
      const renderer = sharedRenderer || (wine && wine.renderer);
      if (renderer) renderer._requestedBrowserFullscreen = true;
      try {
        const result = request.call(target);
        if (result && result.then) await result;
        resizeCanvas();
      } catch (_) {
        if (renderer) renderer._requestedBrowserFullscreen = false;
      }
    }

    // What each app is made of, and which ones get a desktop icon: lib/apps.js.
    // The CLI reads the same table, so `run.js --app=sol` mounts exactly the
    // assets the desktop icon does.
    const apps = window.wineApps.APPS;
    const DEFAULT_APPS = window.wineApps.DESKTOP_APPS;
    const LOCAL_CANDIDATE_APPS = window.wineApps.LOCAL_CANDIDATE_APPS;
    const DEBUG_ONLY_APPS = window.wineApps.DEBUG_ONLY_APPS;
    const appFileUrl = window.wineApps.appFileUrl;

    const LOCAL_DESKTOP = /^(localhost|127\.|0\.0\.0\.0|::1$|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
    const DEBUG_MODE = new URLSearchParams(location.search).has('debug');

    // Launching, stopping, run-slice policy and the tab-local LAN segment all
    // live in lib/browser-shell.js. The page hands it the things that are
    // genuinely the page's: the registry, the canvas sizing policy, the debug
    // log pane, and what to tidy up once the last guest is gone.
    const shell = window.browserShell.createBrowserShell({
      apps,
      debugMode: DEBUG_MODE,
      screenCanvasSize: () => screenCanvasSize(),
      appendDebugLog: text => appendDebugLog(text),
      onStopAll: () => {
        document.getElementById('desktop-icons').style.display = '';
        stopDebugMidi(true);
      },
    });
    const runningApps = shell.runningApps;
    // Tests, devtools and the inline toolbar handlers reach for these by name.
    // The shell owns the state; these are live views of it, not copies.
    Object.defineProperty(window, 'wine', { configurable: true, get: () => shell.currentWine });
    Object.defineProperty(window, 'sharedRenderer', { configurable: true, get: () => shell.renderer });
    function launchApp() {
      const select = document.getElementById('app-select');
      if (threadStateViewer) threadStateViewer.beginLaunch(select && select.value);
      return shell.launchApp();
    }
    function stopAllApps() { shell.stopAllApps(); }
    function applyRunSlice() { shell.applyRunSlice(); }

    const threadStateViewer = window.debugThreadState.createDebugThreadState({
      debugMode: DEBUG_MODE,
      getRunningApps: () => runningApps,
    });
    function openThreadState() { return threadStateViewer.open(); }

    // Frame/step graph overlay (lib/perf-hud.js). Off by default even in
    // debug mode — it draws every rAF, and a profiler you cannot turn off is
    // one more thing competing for the frame it is measuring. `?perf` turns
    // it on at load so a headless run can capture it without a click.
    function setPerfHud(on) {
      if (!window.WinePerf) return;
      window.WinePerf.toggle(on);
      const box = document.getElementById('perf-hud-toggle');
      if (box) box.checked = window.WinePerf.enabled;
    }
    if (new URLSearchParams(location.search).has('perf')) {
      window.addEventListener('load', () => setPerfHud(true));
    }
    // Streaming can be switched on mid-session from the toolbar. Requiring a
    // URL parameter meant deciding to measure before loading the page, which
    // is the wrong order: you notice jank while playing, not before.
    function setPerfStream(on) {
      if (!window.WinePerf) return;
      if (on) {
        const id = window.WinePerf.startStream('/api/perf');
        setPerfHud(true);
        console.log('[perf] streaming to /api/perf, session', id);
      } else {
        window.WinePerf.stopStream();
      }
      const box = document.getElementById('perf-stream-toggle');
      if (box) box.checked = on;
    }

    // ---- experimental: real guest threads ---------------------------------
    //
    // Two separate things, and conflating them would make this switch a lie:
    //
    //   1. CAPABILITY — cross-origin isolation, so a shared WebAssembly.Memory
    //      can reach a Worker at all. That part is real and works here: the
    //      switch registers sw-coi.js and reloads, and threads-probe.html
    //      verifies the whole pipeline (isolation, memory transfer, module
    //      transfer including on-the-fly WAT compilation, worker rendering).
    //
    //   2. THE SCHEDULER — guest threads actually running in Workers. NOT
    //      BUILT. It needs a broker for every host import that touches the DOM,
    //      audio, or localStorage (which does not exist in a worker at all).
    //      See docs/design-real-threads.md phase 1.
    //
    // So the switch records the opt-in and reports the true state; it does not
    // pretend the second half exists. ThreadManager logs which backend it ran.
    const THREADS_KEY = 'wine-assembly.threads';
    window.WINE_THREADS = false;

    function threadsIsolated() {
      return typeof crossOriginIsolated !== 'undefined' && crossOriginIsolated;
    }

    function updateThreadsStatus() {
      const el = document.getElementById('threads-status');
      const box = document.getElementById('threads-toggle');
      if (!el || !box) return;
      const wanted = localStorage.getItem(THREADS_KEY) === '1';
      box.checked = wanted;
      if (!wanted) { el.textContent = ''; return; }
      if (!threadsIsolated()) {
        el.textContent = 'not isolated';
        el.title = 'No COOP/COEP in effect. Toggle again to install the service worker and reload.';
        return;
      }
      // Honest wording: isolation is real, the worker scheduler is not.
      el.textContent = 'isolated · cooperative sched';
      el.title = 'Cross-origin isolation is active, so real threads are possible. '
        + 'The Worker backend is not implemented yet (docs/design-real-threads.md phase 1), '
        + 'so guest threads still share this thread.';
    }

    async function setThreads(on) {
      localStorage.setItem(THREADS_KEY, on ? '1' : '0');
      if (!on) {
        window.WINE_THREADS = false;
        updateThreadsStatus();
        appendDebugLog('[threads] opt-out recorded (isolation left in place; use threads-probe.html to remove the service worker)');
        return;
      }
      window.WINE_THREADS = true;
      if (threadsIsolated()) {
        updateThreadsStatus();
        appendDebugLog('[threads] isolated. Worker scheduler is not implemented yet — '
          + 'guest threads still run cooperatively on this thread (design-real-threads.md phase 1).');
        return;
      }
      if (!navigator.serviceWorker) {
        updateThreadsStatus();
        appendDebugLog('[threads] no service worker API (private browsing?) — isolation is unavailable here, '
          + 'so this session can only ever run single-threaded. That is a supported mode, not a failure.');
        return;
      }
      appendDebugLog('[threads] installing isolation service worker and reloading…');
      try {
        await navigator.serviceWorker.register('sw-coi.js', { scope: './' });
        await navigator.serviceWorker.ready;
        setTimeout(() => location.reload(), 300);
      } catch (err) {
        appendDebugLog('[threads] service worker registration failed: ' + (err && err.message || err));
        updateThreadsStatus();
      }
    }

    // Restore the opt-in across the reload the service worker needs.
    if (localStorage.getItem(THREADS_KEY) === '1') {
      window.WINE_THREADS = true;
      window.addEventListener('load', updateThreadsStatus);
    }

    // An app in exclusive fullscreen hides the toolbar, so the checkbox is
    // unreachable precisely when someone is playing the thing that feels
    // laggy. Keyboard is the only surface that survives that layout:
    //   Ctrl+Alt+P  overlay        Ctrl+Alt+S  stream
    // Capture phase, because the canvas handlers below forward keys to the
    // guest and would otherwise swallow the combination.
    window.addEventListener('keydown', e => {
      if (!e.ctrlKey || !e.altKey) return;
      const k = (e.key || '').toLowerCase();
      if (k !== 'p' && k !== 's') return;
      e.preventDefault();
      e.stopPropagation();
      if (k === 'p') setPerfHud(!(window.WinePerf && window.WinePerf._visible));
      else setPerfStream(!(window.WinePerf && window.WinePerf.streamUrl));
    }, true);

    // `?perf-stream` posts samples to the dev server's /api/perf sink, so a
    // session someone is really playing can be watched from a terminal.
    // Collection runs whether or not the overlay is drawn.
    if (new URLSearchParams(location.search).has('perf-stream')) {
      window.addEventListener('load', () => {
        const url = new URLSearchParams(location.search).get('perf-stream') || '/api/perf';
        const id = window.WinePerf && window.WinePerf.startStream(url);
        const box = document.getElementById('perf-stream-toggle');
        if (box) box.checked = true;
        console.log('[perf] streaming to', url, 'session', id);
      });
    }

    function initDesktop() {
      const desktopApps = LOCAL_DESKTOP
        ? DEFAULT_APPS.concat(LOCAL_CANDIDATE_APPS)
        : DEFAULT_APPS;
      const selectorApps = DEBUG_MODE
        ? DEFAULT_APPS.concat(DEBUG_ONLY_APPS)
        : desktopApps;
      const desktopAppSet = new Set(desktopApps.map(a => a[0]));
      const selectorAppSet = new Set(selectorApps.map(a => a[0]));
      // Pre-launch click forwarder: canvas sits over the icons even before
      // wireCanvasInput runs, so clicks would be swallowed. Forward any click
      // on the canvas through to the icon underneath until the real input
      // wiring takes over (wireCanvasInput overwrites these handlers).
      const cv = document.getElementById('screen');
      cv.onmousedown = e => {
        if (window.browserInput.isWired()) return;
        cv.style.pointerEvents = 'none';
        const under = document.elementFromPoint(e.clientX, e.clientY);
        cv.style.pointerEvents = '';
        const iconEl = under && under.closest && under.closest('.desktop-icon');
        if (iconEl) iconEl.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: e.clientX, clientY: e.clientY }));
      };
      cv.addEventListener('touchstart', e => {
        if (window.browserInput.isWired()) return;
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        e.preventDefault();
        cv.style.pointerEvents = 'none';
        const under = document.elementFromPoint(t.clientX, t.clientY);
        cv.style.pointerEvents = '';
        const iconEl = under && under.closest && under.closest('.desktop-icon');
        if (iconEl) iconEl.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: t.clientX, clientY: t.clientY }));
      }, { passive: false });
      const sel = document.getElementById('app-select');
      for (const opt of [...sel.querySelectorAll('option')]) {
        if (!selectorAppSet.has(opt.value)) opt.remove();
      }
      for (const grp of [...sel.querySelectorAll('optgroup')]) {
        if (!grp.querySelector('option')) grp.remove();
      }
      const grid = document.getElementById('desktop-icons');
      for (const [value, label, glyph] of desktopApps) {
        const el = document.createElement('div');
        el.className = 'desktop-icon';
        el.dataset.app = value;
        el.innerHTML = '<div class="icon-img">' + glyph + '</div><div class="icon-label">' + label + '</div>';
        const exePath = apps[value] && apps[value].exe;
        if (typeof loadAppIcon === 'function') {
          loadAppIcon(el.querySelector('.icon-img'), value, exePath);
        }
        let lastClick = 0;
        el.addEventListener('click', () => {
          for (const e of grid.querySelectorAll('.desktop-icon.selected')) e.classList.remove('selected');
          el.classList.add('selected');
          const now = Date.now();
          if (now - lastClick < 500) {
            sel.value = value;
            launchApp();
            lastClick = 0;
          } else {
            lastClick = now;
          }
        });
        grid.appendChild(el);
      }
    }
    if (!DEBUG_MODE) {
      document.body.classList.add('no-debug');
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initDesktop);
      } else {
        initDesktop();
      }
    }


    // The debug toolbar's MIDI player: lib/debug-midi.js. It plays an asset
    // through the real MCI host path with no guest running, which is what
    // separates "the synth is broken" from "the app never asked for music".
    const debugMidiPlayer = window.debugMidi.createDebugMidi({
      apps,
      appFileUrl,
      debugMode: DEBUG_MODE,
      assetVersion: '168',
      setStatus: (text) => { document.getElementById('status').textContent = text; },
    });
    function playDebugMidi() { return debugMidiPlayer.play(); }
    function stopDebugMidi(quiet) { debugMidiPlayer.stop(quiet); }

    debugMidiPlayer.init();

    window.DEBUG_INPUT_PROFILE = false;
    window.DEBUG_INPUT_PROFILE_LOG = false;

    window.addEventListener('unhandledrejection', e => {
      appendDebugLog('ERROR: unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
    window.addEventListener('error', e => {
      appendDebugLog('ERROR: ' + (e.message || e.error || e));
    });

    function setInputProfileEnabled(enabled) {
      window.DEBUG_INPUT_PROFILE = !!enabled;
      const status = document.getElementById('input-profile-status');
      if (status) status.textContent = enabled ? 'waiting' : '';
    }

    function updateInputProfileUI(profile) {
      const status = document.getElementById('input-profile-status');
      if (!status || !profile) return;
      const ms = profile.totalMs || 0;
      const runMs = profile.steps
        .filter(s => s.name === 'wasm-run-slice')
        .reduce((sum, s) => sum + ((s.data && s.data.ms) || 0), 0);
      status.textContent = `${ms.toFixed(3)}ms run ${runMs.toFixed(3)}`;
    }

    function appendDebugLog(text) {
      const el = document.getElementById('log');
      if (!el) return;
      el.textContent += text + '\n';
      el.scrollTop = el.scrollHeight;
    }

    function printInputProfiles() {
      const profiles = window.__inputPaintProfiles || [];
      const last = profiles[profiles.length - 1];
      if (!last) {
        const msg = '[input-profile] no samples yet';
        console.log(msg);
        appendDebugLog(msg);
        return;
      }
      console.log('[input-profile] last profile', last);
      const rows = last.steps.map(s => ({
        step: s.name,
        delta_ms: s.dt.toFixed(3),
        at_ms: s.at.toFixed(3),
        detail: s.data ? JSON.stringify(s.data) : '',
      }));
      console.table(rows);
      const lines = [
        `[input-profile] ${last.label} total=${last.totalMs.toFixed(3)}ms`,
        '  step                         +ms      at      detail',
      ];
      for (const row of rows) {
        lines.push(
          `  ${row.step.padEnd(26).slice(0, 26)} ${row.delta_ms.padStart(7)} ${row.at_ms.padStart(7)}  ${row.detail}`
        );
      }
      appendDebugLog(lines.join('\n'));
    }

    function screenCanvasSize() {
      const canvas = document.getElementById('screen');
      const wrap = document.getElementById('screen-wrap');
      const MIN_BACKING_WIDTH = 640;
      const MIN_BACKING_HEIGHT = 480;
      const fsElement = document.fullscreenElement || document.webkitFullscreenElement;
      const fullscreen = fsElement === wrap || fsElement === canvas;
      const dedicatedPage = document.body.classList.contains('exclusive-fullscreen');
      const fsRect = fsElement && fsElement.getBoundingClientRect ? fsElement.getBoundingClientRect() : null;
      const vv = window.visualViewport;
      const displayW = Math.floor(fullscreen ? Math.max(
        (fsRect && fsRect.width) || 0,
        (vv && vv.width) || 0,
        window.innerWidth || 0,
        wrap.clientWidth || 0,
        canvas.clientWidth || 0
      ) : (dedicatedPage ? canvas.clientWidth : wrap.clientWidth));
      const displayH = Math.floor(fullscreen ? Math.max(
        (fsRect && fsRect.height) || 0,
        (vv && vv.height) || 0,
        window.innerHeight || 0,
        wrap.clientHeight || 0,
        canvas.clientHeight || 0
      ) : (dedicatedPage ? canvas.clientHeight : wrap.clientHeight));
      const scale = displayW > 0 ? Math.max(1, MIN_BACKING_WIDTH / displayW) : 1;
      const w = Math.max(MIN_BACKING_WIDTH, displayW | 0);
      const h = Math.max(MIN_BACKING_HEIGHT, Math.round((displayH || 1) * scale));
      return { fullscreen, displayW, displayH, w, h };
    }

    // Resize canvas to match container
    function resizeCanvas() {
      const canvas = document.getElementById('screen');
      const wrap = document.getElementById('screen-wrap');
      const { fullscreen, displayW, displayH, w, h } = screenCanvasSize();
      if (fullscreen) {
        wrap.style.width = displayW + 'px';
        wrap.style.height = displayH + 'px';
        wrap.style.position = 'fixed';
        wrap.style.inset = '0';
        canvas.style.width = displayW + 'px';
        canvas.style.height = displayH + 'px';
        canvas.style.position = 'fixed';
        canvas.style.inset = '0';
      } else {
        wrap.style.width = '';
        wrap.style.height = '';
        wrap.style.position = '';
        wrap.style.inset = '';
        canvas.style.width = '';
        canvas.style.height = '';
        canvas.style.position = '';
        canvas.style.inset = '';
      }
      if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
        const oldW = canvas.width;
        const oldH = canvas.height;
        console.log('[resize] canvas', canvas.width + 'x' + canvas.height, '->', w + 'x' + h);
        canvas.width = w;
        canvas.height = h;
        const renderer = (wine && wine.renderer) || sharedRenderer;
        if (renderer && typeof renderer.handleScreenResize === 'function') {
          renderer.handleScreenResize(oldW, oldH, w, h);
        }
      }
      const desktopIcons = document.getElementById('desktop-icons');
      if (desktopIcons) {
        const sx = displayW > 0 ? displayW / w : 1;
        const sy = displayH > 0 ? displayH / h : sx;
        desktopIcons.style.width = w + 'px';
        desktopIcons.style.height = h + 'px';
        desktopIcons.style.transform = `scale(${sx}, ${sy})`;
      }
      if (wine && wine.renderer) {
        wine.renderer.repaint();
      } else if (sharedRenderer) {
        sharedRenderer.repaint();
      }
    }
    window.resizeCanvas = resizeCanvas;
    window.addEventListener('resize', resizeCanvas);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeCanvas);
    document.addEventListener('fullscreenchange', resizeCanvas);
    document.addEventListener('webkitfullscreenchange', resizeCanvas);
    new ResizeObserver(resizeCanvas).observe(document.getElementById('screen-wrap'));
    requestAnimationFrame(resizeCanvas);

    // Taskbar clock
    setInterval(() => {
      const d = new Date();
      document.getElementById('clock').textContent =
        d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);
  </script>
