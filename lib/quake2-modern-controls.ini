// Wine-Assembly first-launch defaults. Quake executes default.cfg before this
// file, so bindings not named here retain the original game defaults.
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"
bind CTRL "+movedown"
bind c "+movedown"
bind MOUSE1 "+attack"
bind MOUSE2 "+moveup"
bind MWHEELUP "weapprev"
bind MWHEELDOWN "weapnext"

set freelook "1"
set lookspring "0"
set lookstrafe "0"
set cl_run "1"
set crosshair "1"
